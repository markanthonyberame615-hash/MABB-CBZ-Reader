name: Build APK

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "MABB-CBZ-Reader-CBZ-open-support.zip"

jobs:
  build:
    name: Build Kotatsu-Redo CBZ APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Check repository files
      # ============================================================
      - name: Check repository
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Repository contents"
          echo "========================================"

          ls -lah

          echo
          echo "Checking for CBZ source ZIP..."

          if [ ! -f "MABB-CBZ-Reader-CBZ-open-support.zip" ]; then
            echo "ERROR: MABB-CBZ-Reader-CBZ-open-support.zip was not found."
            echo
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo
          echo "Found:"
          ls -lh "MABB-CBZ-Reader-CBZ-open-support.zip"


      # ============================================================
      # 3. Extract Android project
      # ============================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MABB-CBZ-Reader-CBZ-open-support.zip"

          echo "========================================"
          echo "Extracting Android project"
          echo "========================================"

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo
          echo "Extraction completed."

          echo
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100


      # ============================================================
      # 4. Find Gradle project
      # ============================================================
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for Gradle project"
          echo "========================================"

          GRADLEW="$(find extracted -type f -name "gradlew" -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Could not find gradlew."
            echo
            echo "Searching for Gradle files..."
            find extracted -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          echo
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Set up Java
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 6. Check Java
      # ============================================================
      - name: Check Java
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Java information"
          echo "========================================"

          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ============================================================
      # 7. Check Android SDK
      # ============================================================
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Android SDK information"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Android SDK contents:"
          ls -lah "$ANDROID_HOME"

          echo
          echo "Installed SDK platforms:"
          if [ -d "$ANDROID_HOME/platforms" ]; then
            ls -lah "$ANDROID_HOME/platforms"
          else
            echo "No platforms directory found."
          fi

          echo
          echo "Installed build-tools:"
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            ls -lah "$ANDROID_HOME/build-tools"
          else
            echo "No build-tools directory found."
          fi


      # ============================================================
      # 8. Make Gradle executable
      # ============================================================
      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Gradle wrapper permissions:"
          ls -lh gradlew


      # ============================================================
      # 9. Check Gradle
      # ============================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Gradle information"
          echo "========================================"

          ./gradlew --version


      # ============================================================
      # 10. Clean previous build
      # ============================================================
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning project..."

          ./gradlew clean --no-daemon


      # ============================================================
      # 11. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building Debug APK"
          echo "========================================"

          ./gradlew assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 12. Find generated APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for generated APK"
          echo "========================================"

          APK_FILES="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/app/build/outputs/apk/debug/*.apk" \
            -print)"

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No Debug APK was generated."
            echo
            echo "Searching all APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo
          echo "Generated APK:"
          echo "$APK_FILES"


      # ============================================================
      # 13. Display APK information
      # ============================================================
      - name: Display APK information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "APK information"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/app/build/outputs/apk/debug/*.apk" \
            -exec ls -lh {} \;


      # ============================================================
      # 14. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Redo-CBZ-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
